<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>왜? 경주</title></head><body><title>왜? 경주</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* Layout: one phone-width paper column; each view is a stack of paper-cut cards on cream. Single light "paper" theme by choice. */
:root{
  --paper:#FFF6E9; --card:#FFFDF8; --ink:#16213E; --ink-soft:#3D4766; --ink-faint:#5A6380;
  --coral:#3F78BD; --coral-deep:#2E5F9E; --mint:#9ED9C5; --mint-bg:#E6F5EE; --sun:#FFD66B; --sun-bg:#FFF1C9;
  --sky-bg:#DDF0FF; --lilac-bg:#EBDDF7; --peach-bg:#FFE3D8; --shadow:rgba(22,33,62,.13); --line:#EADCC8;
  --display:'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.55;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px;
  background-image:radial-gradient(rgba(22,33,62,.035) 1px, transparent 1.2px);background-size:14px 14px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;border:0}
.btn,label.btn{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:anywhere}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--coral-deep);outline-offset:2px}
.paper{background:var(--card);border-radius:22px;box-shadow:5px 7px 0 var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:20px;padding:13px 20px;border-radius:999px;background:var(--coral-deep);color:#FFFDF8;box-shadow:3px 4px 0 var(--shadow);min-height:52px}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink-faint);font-size:14px}
.pill{display:inline-block;font-family:var(--display);font-size:15px;padding:4px 12px;border-radius:999px;background:var(--sun-bg);color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:var(--card);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:16px;box-shadow:3px 4px 0 var(--shadow);color:var(--ink)}
.stampcount{font-family:var(--display);font-size:16px;color:var(--ink)}
.dots{display:inline-flex;gap:5px;margin-left:6px;vertical-align:middle}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--coral)}

/* start */
.hero{text-align:center;padding:22px 8px 6px;display:flex;flex-direction:column;gap:8px;align-items:center}
.eyebrow{font-family:var(--display);color:var(--coral-deep);font-size:15px;letter-spacing:.02em}
.logo{font-size:64px;color:var(--ink)}
.logo span{color:var(--coral)}
.tag{font-family:var(--display);font-size:20px}
.cast{display:flex;align-items:flex-end;justify-content:center;gap:4px;margin-top:6px}
.cast > div{min-width:0}
.cast svg{display:block;width:100%;height:auto}
.ground{height:14px;border-radius:10px;background:var(--mint);box-shadow:3px 4px 0 var(--shadow);margin:-4px 6px 0}
.choice{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;color:var(--ink)}
.opt b{font-family:var(--display);font-weight:400;font-size:19px;display:block}
.opt small{color:var(--ink-faint);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--coral-deep);background:var(--sky-bg)}
.opt .tick{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .tick{background:var(--coral-deep);border-color:var(--coral-deep);box-shadow:inset 0 0 0 4px var(--sky-bg)}
label.field{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:16px}
input[type=text],textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
.promise{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.promise span{font-size:13px;background:var(--mint-bg);border-radius:999px;padding:4px 10px;color:#2F5A4B}

/* map */
.map{position:relative;aspect-ratio:3/4;max-width:100%;background:#E3EFFB;border-radius:26px;box-shadow:5px 7px 0 var(--shadow);overflow:hidden}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;width:44%;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;padding:0;color:var(--ink)}
.spot .ch{width:72%;position:relative}
.spot .ch svg{display:block;width:100%;height:auto}
.spot .nm{font-family:var(--display);font-size:17px;background:var(--card);padding:3px 14px;border-radius:999px;box-shadow:3px 4px 0 var(--shadow)}
.spot .num{position:absolute;left:-6px;top:-4px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#FFF6E9;font-family:var(--display);font-size:16px;display:grid;place-items:center}
.spot .done{position:absolute;right:-8px;top:-6px;width:58px;height:58px;border-radius:50%;border:3px solid var(--coral);color:var(--coral-deep);font-family:var(--display);font-size:14px;display:grid;place-items:center;transform:rotate(-14deg);background:rgba(255,253,248,.88);line-height:1.05;text-align:center}
.qrnote{display:flex;gap:12px;align-items:flex-start}
.qrnote .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sun);display:grid;place-items:center}

/* station */
.greet{display:flex;gap:12px;align-items:flex-end}
.greet .big{width:44%;flex:none}
.greet .big svg{width:100%;height:auto;display:block}
.bubble{position:relative;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:4px 6px 0 var(--shadow);font-family:var(--display);font-size:19px;line-height:1.35;margin-bottom:30%}
.bubble::after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
details.fact{background:var(--sun-bg);border-radius:18px;padding:12px 16px}
details.fact summary{font-family:var(--display);font-size:17px;cursor:pointer}
details.fact p{margin-top:8px;font-size:16px}
details.fact .note{margin-top:6px;font-size:12.5px;color:var(--ink-faint)}
.safety{display:flex;gap:10px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;font-size:14.5px;color:var(--ink-soft)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end}
.rung{border-radius:12px 12px 6px 6px;font-family:var(--display);font-size:14px;text-align:center;padding:6px 2px;color:var(--ink);background:var(--line);opacity:.6}
.rung:nth-child(1){height:34px}.rung:nth-child(2){height:46px}.rung:nth-child(3){height:58px}.rung:nth-child(4){height:70px}
.rung.on{opacity:1;box-shadow:3px 4px 0 var(--shadow)}
.rung.now{outline:3px solid var(--ink);outline-offset:1px}
.r1{background:var(--peach-bg)}.r2{background:var(--sun-bg)}.r3{background:var(--sky-bg)}.r4{background:var(--lilac-bg)}
.levelsw{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:3px 4px 0 var(--shadow)}
.levelsw button{border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:14px;background:none;color:var(--ink-soft)}
.levelsw button[aria-pressed="true"]{background:var(--ink);color:#FFF6E9}
.qcard{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtext{font-family:var(--display);font-size:24px;line-height:1.35}
.tip{font-size:14.5px;color:var(--ink-soft);background:var(--mint-bg);border-radius:12px;padding:8px 12px}
.follow{display:flex;gap:10px;align-items:flex-start;background:var(--sky-bg);border-radius:18px;padding:12px}
.follow .av{width:46px;flex:none}
.follow .av svg{width:100%;height:auto;display:block}
.follow b{font-family:var(--display);font-weight:400;font-size:13px;color:#3E4A66;display:block}
.follow p{font-family:var(--display);font-size:19px;line-height:1.35}
.photo{display:flex;flex-direction:column;gap:10px}
.polaroid{position:relative;background:var(--card);padding:8px;border-radius:14px;box-shadow:4px 6px 0 var(--shadow);transform:rotate(-1.5deg);align-self:center;width:78%;max-width:100%}
.polaroid img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.polaroid .sticker{position:absolute;right:-10px;bottom:-12px;width:30%}
.polaroid .sticker svg{width:100%;height:auto;display:block}
.spot .pic{position:absolute;left:50%;bottom:-6px;width:40px;height:40px;border-radius:50%;border:3px solid #FFFDF8;object-fit:cover;box-shadow:2px 3px 0 var(--shadow)}
label.btn{cursor:pointer}
.ladder5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:end}
.ladder5 .rg{border-radius:12px 12px 6px 6px;font-family:var(--display);font-size:12.5px;line-height:1.15;text-align:center;padding:6px 2px;color:var(--ink);background:var(--line);opacity:.55;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;word-break:keep-all}
.ladder5 .rg small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.ladder5 .rg.on{opacity:1;box-shadow:3px 4px 0 var(--shadow)}
.ladder5 .rg0{height:44px}.ladder5 .rg1{height:56px}.ladder5 .rg2{height:68px}.ladder5 .rg3{height:80px}.ladder5 .rg4{height:92px}
.ladder5 .rg0.on{background:var(--peach-bg)}.ladder5 .rg1.on{background:var(--sun-bg)}.ladder5 .rg2.on{background:var(--sky-bg)}.ladder5 .rg3.on{background:var(--lilac-bg)}.ladder5 .rg4.on{background:var(--mint-bg)}
.pick{display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:16px;background:var(--card);color:var(--ink-soft);border:2px solid var(--line)}
.who button[aria-pressed="true"]{background:var(--ink);color:#FFF6E9;border-color:var(--ink)}
.deck{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ncard{aspect-ratio:3/4;border-radius:14px;background:var(--coral-deep);color:#FFFDF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:3px 4px 0 var(--shadow);padding:4px;position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(255,253,248,.18) 1.5px,transparent 2px);background-size:9px 9px}
.ncard .big{font-family:var(--display);font-size:32px;line-height:1}
.ncard .q{font-family:var(--display);font-size:14px;opacity:.85}
.ncard.used{background:var(--card);background-image:none;color:var(--ink);border:2px solid var(--line)}
.ncard.used .nn{font-family:var(--display);font-size:16px;line-height:1;color:var(--coral-deep)}
.ncard.used{gap:1px;padding:2px}
.ncard.used .nt{font-family:var(--display);font-size:12px;line-height:1.1;text-align:center;word-break:keep-all}
.ncard.used .na{font-size:11px;line-height:1.1;color:var(--ink-faint);white-space:nowrap}
.ncard.open{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-4px)}
.ncard:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.prog{font-size:15px;color:var(--ink-soft);text-align:center}
.prog b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--coral-deep)}
@media (prefers-reduced-motion: reduce){.ncard.open{transform:none}}
.swap{background:none;border:2px dashed var(--line);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:14px;color:var(--ink-soft);margin-left:auto}
.bonus{background:var(--peach-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bonus b{font-family:var(--display);font-weight:400;font-size:18px}
.linkbtn{background:none;color:var(--ink-faint);text-decoration:underline;font-size:14px;padding:6px}
.qhead{flex-wrap:wrap}
.mine{font-size:15px;color:var(--ink-soft);border-left:4px solid var(--sun);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:#FFF6E9;font-family:var(--display);font-size:17px;padding:12px 18px;border-radius:999px;box-shadow:4px 6px 0 var(--shadow);z-index:20;max-width:calc(100% - 32px);text-align:center}

/* stamp overlay */
.overlay{position:fixed;inset:0;background:rgba(22,33,62,.45);display:grid;place-items:center;z-index:30;padding:24px}
.stampbox{background:var(--card);border-radius:28px;padding:28px 22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:6px 8px 0 var(--shadow)}
.seal{width:150px;height:150px;border-radius:50%;border:6px solid var(--coral);color:var(--coral-deep);display:grid;place-items:center;font-family:var(--display);font-size:22px;text-align:center;line-height:1.15;transform:rotate(-12deg);animation:press .5s cubic-bezier(.2,1.6,.4,1) both;background:var(--sky-bg)}
@keyframes press{from{transform:scale(1.8) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.seal{animation:none}}

/* card */
.cardimg{width:100%;height:auto;border-radius:18px;box-shadow:5px 7px 0 var(--shadow);display:block}
.later{background:var(--lilac-bg);border-radius:18px;padding:14px 16px}
.later b{font-family:var(--display);font-weight:400;font-size:17px;display:block;margin-bottom:4px}
.foot{text-align:center;font-size:12.5px;color:var(--ink-faint)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}

/* v6: modes, photos, book */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;color:var(--ink);min-height:74px}
.mode b{font-family:var(--display);font-weight:400;font-size:20px}
.mode small{color:var(--ink-faint);font-size:13.5px;line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--coral-deep);background:var(--sky-bg)}
.ph4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph4 figure{margin:0;background:var(--card);border-radius:14px;padding:6px;box-shadow:3px 4px 0 var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.ph4 img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block}
.ph4 input[type=text]{font-size:14px;padding:7px 9px;border-radius:10px}
.ph4 .rm{font-size:13px;color:var(--ink-faint);background:none;text-decoration:underline;align-self:flex-end;padding:2px 4px}
.ph4 figcaption{font-size:14px;color:var(--ink-soft);padding:0 4px 4px}
.think{display:flex;flex-direction:column;gap:12px}
.bookcover{background:#14254A;color:#FFF6E9;border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;box-shadow:5px 7px 0 var(--shadow)}
.bookcover .eyebrow{color:#FFD66B}
.bookcover h1{font-size:30px}
.bookcover .ch{width:32%}
.bookcover .ch svg{width:100%;height:auto;display:block}
.chapter{background:var(--card);border-radius:22px;box-shadow:5px 7px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;border-left:10px solid var(--coral)}
.chno{font-family:var(--display);font-size:16px;color:var(--coral-deep)}
.story{font-size:16.5px;line-height:1.75;background:var(--sky-bg);border-radius:14px;padding:12px 14px}
.ainote{font-size:12.5px;color:var(--ink-faint);margin-top:-6px}
.kv{font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.kv b{font-family:var(--display);font-weight:400;color:var(--coral-deep)}
.toc{margin:0;padding-left:0;list-style:none;display:grid;gap:4px;font-family:var(--display);font-size:17px}

/* v7: book viewer */
.bookview{perspective:1200px}
.sheet{position:relative;background:#FFFDF8;border-radius:6px 18px 18px 6px;box-shadow:5px 7px 0 var(--shadow),inset 14px 0 18px -14px rgba(22,33,62,.35);min-height:560px;display:flex;flex-direction:column;border-left:8px solid #2E5F9E;overflow:hidden;animation:flip .35s ease both}
@keyframes flip{from{transform:rotateY(-8deg);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.pg{flex:1;display:flex;flex-direction:column;gap:12px;padding:22px 20px 12px}
.pg .run{font-family:var(--display);font-size:14px;color:var(--coral-deep);letter-spacing:.04em}
.pg .h{font-size:26px}
.pg.cover{background:#14254A;color:#FFF6E9;align-items:center;justify-content:center;text-align:center;gap:14px;padding:34px 22px}
.pg.cover .eyebrow{color:#FFD66B}
.pg.cover .ch,.pg.end .ch{width:38%;align-self:center}
.pg.cover .ch svg,.pg.end .ch svg{width:100%;height:auto;display:block}
.pg.cover .ttl{font-size:32px;line-height:1.25}
.pg.cover .by{font-size:14.5px;color:#C9D6EE;line-height:1.6}
.pg .toc li{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding:6px 0}
.pg .toc li span{color:var(--coral-deep);min-width:3.2em}
.pg .toc li i{margin-left:auto;font-style:normal;font-family:var(--body);font-size:13px;color:var(--ink-faint)}
.chhead{display:flex;align-items:center;gap:10px;margin-top:-4px}
.chhead .mini{width:56px;flex:none}
.chhead .mini svg{width:100%;height:auto;display:block}
.known{font-size:14.5px;line-height:1.6;background:var(--sun-bg);border-radius:12px;padding:10px 12px}
.known b{font-family:var(--display);font-weight:400}
.pg.end{align-items:stretch;justify-content:center}
.endtxt{font-family:var(--display);font-size:19px;line-height:1.55;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center;font-size:13px;color:var(--ink-soft)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--coral-deep)}
.pno{text-align:center;font-size:13px;color:var(--ink-faint);padding:6px 0 12px}
.pg.cover + .pno{background:#14254A;color:#A9C4EA;margin:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* v8: book prose */
.pg.chap{gap:14px}
.pg .subt{font-family:'Gowun Batang',serif;font-size:15px;color:var(--ink-faint);margin-top:-10px}
.hero{margin:0;background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:3px 5px 0 var(--shadow);transform:rotate(-1deg)}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;display:block}
.hero figcaption,.thumbs figcaption{font-family:'Gowun Batang',serif;font-size:14px;color:var(--ink-soft);text-align:center;padding-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumbs figure{margin:0;background:#fff;padding:5px 5px 6px;border-radius:5px;box-shadow:2px 3px 0 var(--shadow)}
.thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;display:block}
.thumbs figcaption{font-size:12px;padding-top:4px}
.pull{margin:6px 0;padding:6px 4px 6px 16px;border-left:4px solid #FFD66B;font-family:'Gowun Batang',serif;font-weight:700;font-size:21px;line-height:1.55;color:var(--ink)}
.pull cite{display:block;font-style:normal;font-weight:400;font-size:14px;color:var(--ink-faint);margin-top:4px}
.prose p{font-family:'Gowun Batang',serif;font-size:16.5px;line-height:1.95;margin:0 0 12px;text-indent:1em;word-break:keep-all}

function thinks(s){return S.think[s.key]=S.think[s.key]||{}}

      '<p class="qtext">'+esc(q)+'</p>'+
      (tipOf(ty)?'<p class="tip">'+tipOf(ty)+'</p>':'')+
      (cur.answered&&e?

    return ask+' '+fillP(pick(ANS[e.ty],seed+i),e.a)+' “'+e.t+'”';
  });
  if(qa.length)paras.push(qa.join(' '));
  /* 3. 사진과 생각 */
  var ci=Math.max(0,S.order.indexOf(s.key)), tail=[];
  var caps=P.filter(function(p){return p.c}).map(function(p){return '“'+p.c+'”'});
  if(caps.length)tail.push(pick(['사진 속에는 '+caps.join(', ')+'의 순간이 남았다.','사진 한 장에는 '+caps.join(', ')+'라는 말을 붙여 두었다.','카메라는 '+caps.join(', ')+'의 순간을 붙잡았다.'],ci));
  var tk=Object.keys(th), V=['적었다','남겼다','썼다'];
  if(tk.length){
    if(S.mode==='solo'){tail.push(pick(['이곳을 떠나기 전, 나는 한 줄을 남겼다.','돌아서기 전, 마음에 남은 것을 적었다.','이곳에서의 마지막 생각은 이랬다.'],ci)+' “'+th[tk[0]]+'”')}
    else{tail.push(pick(['이곳을 떠나기 전, 저마다 한 줄씩 남겼다.','돌아서기 전, 각자의 마음에 남은 것을 적었다.','같은 곳에 서 있었지만, 마음에 남은 것은 저마다 달랐다.'],ci));
      tk.forEach(function(k,j){tail.push(subj(k,'은')+' “'+th[k]+'”'+ra(th[k])+' '+V[(j+ci)%3]+'.')})}
  }
  if(S.own[s.key])tail.push(pick(['그리고 '+(S.mode==='solo'?'나는':'우리는')+' '+s.name+'에게 질문 하나를 남겼다. “'+S.own[s.key]+'” 그 답은 아직 이 책의 빈칸으로 남아 있다.','마지막 질문은 '+(S.mode==='solo'?'내가':'우리가')+' 던졌다. “'+S.own[s.key]+'” 답은 다음에 다시 와서 채울 빈칸이다.','이번에는 '+(S.mode==='solo'?'내가':'우리가')+' '+s.name+'에게 물었다. “'+S.own[s.key]+'” 이 물음표는 다음 장을 기다린다.'],ci));
  if(tail.length)paras.push(tail.join(' '));
  return paras;
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapLines(c,text,maxW,sep){var parts=sep?text.split(sep):text.split(' '),joiner=sep||' ',line='',lines=[];
  for(var i=0;i<parts.length;i++){var test=line?line+joiner+parts[i]:parts[i];if(c.measureText(test).width>maxW&&line){lines.push(line);line=parts[i]}else line=test}
  if(line)lines.push(line);return lines}
function drawCard(){
  var W=1080,H=1520,cv=document.createElement('canvas');cv.width=W;cv.height=H;var c=cv.getContext('2d');
  var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('40px Jua'),document.fonts.load('700 40px "Gowun Batang"'),document.fonts.load('34px "Noto Sans KR"')]).catch(function(){}):Promise.resolve();
  var ph=coverPhoto(), d=new Date(), imgs={};
  fontsReady.then(function(){return urlImg(ph?ph.u:null)}).then(function(p){imgs.ph=p;return Promise.all([svgImg(CHAR.cheom),svgImg(CHAR.mound),svgImg(CHAR.tree)])}).then(function(a){imgs.cheom=a[0];imgs.mound=a[1];imgs.tree=a[2];
    if(S.cover==='E'){
      c.fillStyle='#DCEBFA';c.fillRect(0,0,W,H);
      c.fillStyle='#FFD66B';c.beginPath();c.arc(900,520,72,0,7);c.fill();
      c.fillStyle='#BFE3CF';c.beginPath();c.moveTo(0,810);c.bezierCurveTo(300,640,640,740,W,615);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
      c.fillStyle='#9ED9C5';c.beginPath();c.moveTo(0,1060);c.bezierCurveTo(340,930,740,1030,W,960);c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
      if(imgs.mound)c.drawImage(imgs.mound,90,880,300,183);
      if(imgs.tree)c.drawImage(imgs.tree,770,820,200,240);
      if(imgs.cheom)c.drawImage(imgs.cheom,370,600,340,404);
      c.textAlign='center';c.fillStyle='#16213E';c.font='150px Jua, sans-serif';
      c.fillStyle='#2E5F9E';c.fillText('왜?',W/2-150,250);c.fillStyle='#16213E';c.fillText('경주',W/2+150,250);
      var who=S.mode==='solo'?(S.family||'나'):(S.names.kid||S.family||'우리');
      c.fillStyle='#3D4766';c.font='56px Jua, sans-serif';c.fillText(josa(who,'이','가')+' 묻고 답한 이야기',W/2,350);
      c.fillStyle='#2F5A4B';c.font='44px Jua, sans-serif';c.fillText('첨이와 친구들 · '+d.getFullYear()+' '+season(),W/2,1420);
    } else {
      c.fillStyle='#FBF6EC';c.fillRect(0,0,W,H);
      [[220,270,240,'rgba(191,221,247,.75)'],[820,200,260,'rgba(255,217,199,.75)'],[620,520,180,'rgba(255,240,184,.7)']].forEach(function(b){var g=c.createRadialGradient(b[0],b[1],0,b[0],b[1],b[2]);g.addColorStop(0,b[3]);g.addColorStop(1,'rgba(251,246,236,0)');c.fillStyle=g;c.fillRect(0,0,W,H)});
      c.fillStyle='rgba(142,193,238,.55)';
      [[0,1370,150,1220,410,1370],[300,1370,470,1150,800,1370],[740,1370,860,1270,W,1370]].forEach(function(m){c.beginPath();c.moveTo(m[0],m[1]);c.quadraticCurveTo(m[2],m[3],m[4],m[5]);c.closePath();c.fill()});
      c.fillStyle='rgba(106,159,216,.6)';c.beginPath();c.moveTo(895,1370);c.bezierCurveTo(888,1270,920,1180,930,1105);c.lineTo(975,1105);c.bezierCurveTo(985,1180,1017,1270,1010,1370);c.closePath();c.fill();
      c.fillStyle='rgba(207,228,247,.6)';c.fillRect(0,1365,W,H-1365);
      c.textAlign='center';c.fillStyle='#16213E';c.font='700 82px "Gowun Batang", serif';
      var tl=wrapLines(c,bookTitle(),900).slice(0,2);tl.forEach(function(l,k){c.fillText(l,W/2,170+k*100)});
      var py=200+tl.length*100, pw=600, phh=700;
      c.save();c.translate(W/2,py+phh/2);c.rotate(-0.05);
      c.fillStyle='rgba(22,33,62,.18)';c.fillRect(-pw/2+14,-phh/2+20,pw,phh);
      c.fillStyle='#FFFFFF';c.fillRect(-pw/2,-phh/2,pw,phh);
      var iw=pw-56,ih=iw;
      if(imgs.ph){var p=imgs.ph,sc=Math.max(iw/p.width,ih/p.height),sw=iw/sc,sh=ih/sc;c.drawImage(p,(p.width-sw)/2,(p.height-sh)/2,sw,sh,-iw/2,-phh/2+28,iw,ih)}
      else{c.fillStyle='#DCEBFA';c.fillRect(-iw/2,-phh/2+28,iw,ih);if(imgs.cheom)c.drawImage(imgs.cheom,-150,-phh/2+80,300,356)}
      c.fillStyle='#3D4766';c.font='38px "Gowun Batang", serif';c.fillText(ph?ph.c:'첫 사진을 찍으면 여기에 붙어요',0,phh/2-50);
      c.fillStyle='rgba(255,214,107,.75)';c.save();c.rotate(-0.1);c.fillRect(-90,-phh/2-24,180,54);c.restore();
      c.restore();
      var sy=py+phh+90;
      c.fillStyle='#3D4766';c.font='44px "Gowun Batang", serif';
      wrapLines(c,whoLine(),900).slice(0,2).forEach(function(l,k){c.fillText(l,W/2,sy+k*58)});
      c.fillText(d.getFullYear()+'년 '+season(),W/2,sy+2*58+4);
      c.fillStyle='#16213E';c.font='38px "Gowun Batang", serif';c.fillText((S.family||'경주를 걸은 사람')+' · '+d.getFullYear()+'. '+(d.getMonth()+1)+'.',W/2,1460);
    }
    var url='';try{url=cv.toDataURL('image/png')}catch(e){}
    var wrapEl=document.getElementById('cardWrap');if(!wrapEl)return;
    wrapEl.innerHTML=url?'<img class="cardimg" alt="나만의 책 표지 이미지" src="'+url+'">':'<p class="paper">이 브라우저에서는 표지 이미지를 만들 수 없어요.</p>';
  });
}

/* ---------- 말로 남기기 (음성 → 글자) ---------- */
var REC=null;
var MICSVG='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function attachMics(){app.querySelectorAll('textarea').forEach(function(ta){if(ta.dataset.mic||ta.dataset.nomic)return;ta.dataset.mic='1';
  var b=document.createElement('button');b.type='button';b.className='mic';b.innerHTML=MICSVG+'<span>말로 남기기</span>';
  ta.insertAdjacentElement('afterend',b);b.onclick=function(){toggleMic(ta,b)}})}
function kbHint(ta){
  ta.focus();
  var old=ta.parentNode.querySelector('.kbhint');if(old)old.remove();
  var h=document.createElement('p');h.className='kbhint';h.setAttribute('role','status');
  h.innerHTML=MICSVG+'<span><b>키보드의 마이크</b>를 누르고 말해 주세요.<br>갤럭시는 화면 맨 아래, 아이폰은 키보드 위·아래에 있어요. '+(ta.id==='ans'?'다 말한 뒤 <b>글로 남기기</b>를 눌러야 저장돼요.':'말한 내용은 저절로 저장돼요.')+'</span>';
  ta.insertAdjacentElement('afterend',h);
  var off=function(){if(ta.value.trim()){h.remove();ta.removeEventListener('input',off)}};ta.addEventListener('input',off);
}
function toggleMic(ta,b,done,idle,busy){idle=idle||'말로 남기기';busy=busy||'듣는 중 · 누르면 멈춰요';
  if(REC){try{REC.stop()}catch(e){}if(REC&&REC._finish)REC._finish();return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){kbHint(ta);return}
  var r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=true;
  var base=ta.value?ta.value.replace(/\s*$/,' '):'', max=ta.maxLength>0?ta.maxLength:600, got=false, failed=false;
  var finished=false;
  var reset=function(){b.classList.remove('on');b.querySelector('span').textContent=idle};
  var finish=function(){if(finished)return;finished=true;clearTimeout(wait);REC=null;reset();if(got){if(done)done()}else{kbHint(ta)}};
  var wait=setTimeout(function(){if(!got){failed=true;try{r.abort()}catch(e){}finish()}},3500);
  r.onresult=function(e){got=true;var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=(base+t).slice(0,max);ta.dispatchEvent(new Event('input'))};
  r.onerror=function(){failed=true};
  r.onend=finish;
  r._finish=finish;
  try{r.start();REC=r;b.classList.add('on');b.querySelector('span').textContent=busy}catch(err){finish()}
}
/* ---------- router ---------- */
function route(){
  var h=(location.hash||'').replace('#','');
  var s=byKey(h);
  var ov=document.querySelector('.overlay');if(ov)ov.remove();if(REC){try{REC.stop()}catch(e){}}
  if(s){vStation(s)}
  else if(h==='map'){vMap()}
  else if(h==='card'||h==='book'){vBook()}
  else vStart();
}
app.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go)}});
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0)});
route();
})();
